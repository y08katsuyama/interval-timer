<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイ・インターバルタイマー</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            position: relative; /* バージョン表示の基準位置 */
        }
        /* 右上のバージョン表示 */
        .version-badge {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 0.8rem;
            color: #666;
            background-color: #1e1e1e;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #333;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .settings-panel {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .setting-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .setting-field {
            flex: 1;
            background-color: #2c2c2c;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            text-align: center;
        }
        .setting-field label {
            display: block;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 5px;
        }
        .setting-field input {
            width: 100%;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            background-color: transparent;
            color: #fff;
            border: none;
            outline: none;
        }
        .status {
            font-size: 1.8rem;
            color: #00e676;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .timer-display {
            font-size: 5rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            margin: 10px 0;
        }
        .sets {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 25px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            flex: 1;
        }
        .btn-start { background-color: #00e676; color: #121212; }
        .btn-stop { background-color: #ff5252; }
        .btn-reset { background-color: #424242; }
    </style>
</head>
<body>

    <!-- 右上のバージョン表示 -->
    <div class="version-badge">v1.6</div>

    <div class="container">
        <div class="settings-panel" id="settingsPanel">
            <div class="setting-row">
                <div class="setting-field">
                    <label>作業 (秒)</label>
                    <input type="number" id="workInput" value="30" min="1" oninput="applySettings()">
                </div>
                <div class="setting-field">
                    <label>休憩 (秒)</label>
                    <input type="number" id="restInput" value="10" min="0" oninput="applySettings()">
                </div>
            </div>
            <div class="setting-row">
                <div class="setting-field">
                    <label>セット数</label>
                    <input type="number" id="setInput" value="8" min="1" oninput="applySettings()">
                </div>
            </div>
        </div>

        <div class="status" id="statusText">準備完了</div>
        <div class="timer-display" id="timeDisplay">00:30</div>
        <div class="sets" id="setInfo">セット 1 / 8</div>
        
        <div class="btn-group">
            <button class="btn-start" id="mainBtn" onclick="toggleTimer()">スタート</button>
            <button class="btn-reset" onclick="resetTimer()">リセット</button>
        </div>
    </div>

    <script>
        let workTime = 30; 
        let restTime = 10; 
        let totalSets = 8; 
        
        let currentTime = workTime;
        let currentSet = 1;
        let isWorkPhase = true;
        let timerId = null;
        let isRunning = false;

        const statusText = document.getElementById('statusText');
        const timeDisplay = document.getElementById('timeDisplay');
        const setInfo = document.getElementById('setInfo');
        const mainBtn = document.getElementById('mainBtn');

        const workInput = document.getElementById('workInput');
        const restInput = document.getElementById('restInput');
        const setInput = document.getElementById('setInput');

        function updateDisplay() {
            let mins = Math.floor(currentTime / 60);
            let secs = currentTime % 60;
            timeDisplay.innerText = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
            setInfo.innerText = `セット ${currentSet} / ${totalSets}`;
        }

        function applySettings() {
            if (isRunning) return; 
            workTime = Math.max(1, parseInt(workInput.value) || 30);
            restTime = Math.max(0, parseInt(restInput.value) || 0);
            totalSets = Math.max(1, parseInt(setInput.value) || 1);
            
            if (isWorkPhase && currentSet === 1) {
                currentTime = workTime;
            }
            updateDisplay();
        }

        function playTone(freq, duration, type = 'sine') {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function beep() {
            playTone(800, 0.2, 'sine');
            if (navigator.vibrate) {
                navigator.vibrate(200);
            }
        }

        function timeUpAlert() {
            playTone(1200, 0.5, 'square');
            if (navigator.vibrate) {
                navigator.vibrate([300, 100, 300]);
            }
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                isRunning = false;
                mainBtn.innerText = 'スタート';
                mainBtn.className = 'btn-start';
                workInput.disabled = false;
                restInput.disabled = false;
                setInput.disabled = false;
            } else {
                workTime = Math.max(1, parseInt(workInput.value) || 30);
                restTime = Math.max(0, parseInt(restInput.value) || 0);
                totalSets = Math.max(1, parseInt(setInput.value) || 1);

                isRunning = true;
                mainBtn.innerText = '一時停止';
                mainBtn.className = 'btn-stop';
                workInput.disabled = true;
                restInput.disabled = true;
                setInput.disabled = true;
                
                timerId = setInterval(() => {
                    if (currentTime > 0) {
                        currentTime--;
                        updateDisplay();

                        if (currentTime === 0) {
                            timeUpAlert();
                        } else if (currentTime <= 3) {
                            beep();
                        }
                    } else {
                        if (isWorkPhase) {
                            if (restTime > 0) {
                                isWorkPhase = false;
                                statusText.innerText = '休憩中';
                                statusText.style.color = '#ff5252';
                                currentTime = restTime;
                                updateDisplay();
                            } else {
                                moveToNextSetOrFinish();
                            }
                        } else {
                            moveToNextSetOrFinish();
                        }
                    }
                }, 1000);
            }
        }

        function moveToNextSetOrFinish() {
            if (currentSet < totalSets) {
                currentSet++;
                isWorkPhase = true;
                statusText.innerText = '作業中！';
                statusText.style.color = '#00e676';
                currentTime = workTime;
                updateDisplay();
            } else {
                clearInterval(timerId);
                isRunning = false;
                statusText.innerText = '完了！お疲れ様でした';
                mainBtn.innerText = 'スタート';
                mainBtn.className = 'btn-start';
                workInput.disabled = false;
                restInput.disabled = false;
                setInput.disabled = false;
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            isWorkPhase = true;
            currentSet = 1;
