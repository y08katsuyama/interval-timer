<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイ・インターバルタイマー</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .settings-panel {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: left;
        }
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .setting-item:last-child {
            margin-bottom: 0;
        }
        .setting-item label {
            font-size: 0.95rem;
            color: #ccc;
        }
        .setting-item input {
            width: 70px;
            padding: 6px;
            font-size: 1rem;
            text-align: center;
            background-color: #2c2c2c;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
        }
        .status {
            font-size: 1.8rem;
            color: #00e676;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .timer-display {
            font-size: 5rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            margin: 10px 0;
        }
        .sets {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 25px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            flex: 1;
        }
        .btn-start { background-color: #00e676; color: #121212; }
        .btn-stop { background-color: #ff5252; }
        .btn-reset { background-color: #424242; }
    </style>
</head>
<body>

    <div class="container">
        <!-- oninputに変更し、入力と同時に反映されるように修正 -->
        <div class="settings-panel" id="settingsPanel">
            <div class="setting-item">
                <label for="workInput">作業時間 (秒):</label>
                <input type="number" id="workInput" value="30" min="1" oninput="applySettings()">
            </div>
            <div class="setting-item">
                <label for="restInput">休憩時間 (秒):</label>
                <input type="number" id="restInput" value="10" min="0" oninput="applySettings()">
            </div>
            <div class="setting-item">
                <label for="setInput">総セット数:</label>
                <input type="number" id="setInput" value="8" min="1" oninput="applySettings()">
            </div>
        </div>

        <div class="status" id="statusText">準備完了</div>
        <div class="timer-display" id="timeDisplay">00:30</div>
        <div class="sets" id="setInfo">セット 1 / 8</div>
        
        <div class="btn-group">
            <button class="btn-start" id="mainBtn" onclick="toggleTimer()">スタート</button>
            <button class="btn-reset" onclick="resetTimer()">リセット</button>
        </div>
    </div>

    <script>
        let workTime = 30; 
        let restTime = 10; 
        let totalSets = 8; 
        
        let currentTime = workTime;
        let currentSet = 1;
        let isWorkPhase = true;
        let timerId = null;
        let isRunning = false;

        const statusText = document.getElementById('statusText');
        const timeDisplay = document.getElementById('timeDisplay');
        const setInfo = document.getElementById('setInfo');
        const mainBtn = document.getElementById('mainBtn');

        const workInput = document.getElementById('workInput');
        const restInput = document.getElementById('restInput');
        const setInput = document.getElementById('setInput');

        function updateDisplay() {
            let mins = Math.floor(currentTime / 60);
            let secs = currentTime % 60;
            timeDisplay.innerText = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
            setInfo.innerText = `セット ${currentSet} / ${totalSets}`;
        }

        function applySettings() {
            if (isRunning) return; 
            workTime = parseInt(workInput.value) || 30;
            restTime = parseInt(restInput.value) || 10;
            totalSets = parseInt(setInput.value) || 8;
            
            // 待機中であれば、変更した作業時間を即座にタイマー表示に反映する
            if (isWorkPhase && currentSet === 1) {
                currentTime = workTime;
            }
            updateDisplay();
        }

        function beep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 800;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);
                osc.stop(audioCtx.currentTime + 0.2);
            } catch (e) {}
            if (navigator.vibrate) {
                navigator.vibrate(200);
            }
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                isRunning = false;
                mainBtn.innerText = 'スタート';
                mainBtn.className = 'btn-start';
                workInput.disabled = false;
                restInput.disabled = false;
                setInput.disabled = false;
            } else {
                // スタートを押した瞬間にも最新の入力値を確実に取得
                workTime = parseInt(workInput.value) || 30;
                restTime = parseInt(restInput.value) || 10;
                totalSets = parseInt(setInput.value) || 8;

                isRunning = true;
                mainBtn.innerText = '一時停止';
                mainBtn.className = 'btn-stop';
                workInput.disabled = true;
                restInput.disabled = true;
                setInput.disabled = true;
                
                timerId = setInterval(() => {
                    if (currentTime > 0) {
                        currentTime--;
                        if (currentTime <= 3 && currentTime > 0) {
                            beep();
                        }
                        updateDisplay();
                    } else {
                        beep();
                        if (isWorkPhase) {
                            isWorkPhase = false;
                            statusText.innerText = '休憩中';
                            statusText.style.color = '#ff5252';
                            currentTime = restTime;
                        } else {
                            if (currentSet < totalSets) {
                                currentSet++;
                                isWorkPhase = true;
                                statusText.innerText = '作業中！';
                                statusText.style.color = '#00e676';
                                currentTime = workTime;
                            } else {
                                clearInterval(timerId);
                                isRunning = false;
                                statusText.innerText = '完了！お疲れ様でした';
                                mainBtn.innerText = 'スタート';
                                mainBtn.className = 'btn-start';
                                workInput.disabled = false;
                                restInput.disabled = false;
                                setInput.disabled = false;
                                return;
                            }
                        }
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            isWorkPhase = true;
            currentSet = 1;
            workTime = parseInt(workInput.value) || 30;
            currentTime = workTime;
            statusText.innerText = '準備完了';
            statusText.style.color = '#00e676';
            mainBtn.innerText = 'スタート';
            mainBtn.className = 'btn-start';
            workInput.disabled = false;
            restInput.disabled = false;
            setInput.disabled = false;
            updateDisplay();
        }

        updateDisplay();
    </script>
</body>
</html>
