<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トレーニングインターバルタイマー</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:.3s;
    background:#222;
    color:white;
}

.container{
    width:95%;
    max-width:450px;
    text-align:center;
}

h1{
    margin-bottom:20px;
}

.settings{
    display:grid;
    gap:10px;
    margin-bottom:25px;
}

label{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

input{
    width:100px;
    padding:8px;
    font-size:18px;
}

.status{
    font-size:32px;
    font-weight:bold;
    margin:10px 0;
}

.timer{
    font-size:90px;
    font-weight:bold;
    margin:20px 0;
}

.sets{
    font-size:24px;
    margin-bottom:20px;
}

.buttons{
    display:flex;
    gap:10px;
}

button{
    flex:1;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.start{
    background:#28a745;
    color:#fff;
}

.pause{
    background:#ffc107;
}

.reset{
    background:#dc3545;
    color:#fff;
}

.work{
    background:#b30000;
}

.rest{
    background:#0047ab;
}

.ready{
    background:#555;
}

.finish{
    background:#008000;
}
</style>
</head>
<body class="ready">

<div class="container">
    <h1>💪 インターバルタイマー</h1>

    <div class="settings">

        <label>
            準備時間(秒)
            <input id="readyTime" type="number" value="5">
        </label>

        <label>
            運動時間(秒)
            <input id="workTime" type="number" value="30">
        </label>

        <label>
            休憩時間(秒)
            <input id="restTime" type="number" value="15">
        </label>

        <label>
            セット数
            <input id="totalSets" type="number"
                   value="10">
        </label>
    </div>

    <div class="status" id="status">
        READY
    </div>

    <div class="timer" id="timer">
        00:05
    </div>

    <div class="sets" id="sets">
        セット 0 / 0
    </div>

    <div class="buttons">
        <button class="start" onclick="startTimer()">開始</button>
        <button class="pause" onclick="pauseTimer()">一時停止</button>
        <button class="reset" onclick="resetTimer()">リセット</button>
    </div>
</div>

<script>
let phase = "ready";
let currentSet = 1;
let timer;
let timeLeft = 0;
let running = false;

const audioCtx =
window.AudioContext ?
new AudioContext() :
new webkitAudioContext();

function beep(freq=800,duration=200){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.frequency.value=freq;
    osc.type="sine";

    osc.start();

    gain.gain.setValueAtTime(
        0.2,
        audioCtx.currentTime
    );

    osc.stop(
        audioCtx.currentTime + duration/1000
    );
}

function vibrate(ms=300){
    if(navigator.vibrate){
        navigator.vibrate(ms);
    }
}

function format(sec){
    const m =
    String(Math.floor(sec/60)).padStart(2,'0');
    const s =
    String(sec%60).padStart(2,'0');

    return `${m}:${s}`;
}

function updateDisplay(){
    document.getElementById("timer")
        .textContent = format(timeLeft);
}

function startTimer(){

    if(running) return;

    if(timeLeft===0){

        phase="ready";

        currentSet=1;

        timeLeft=parseInt(
            document.getElementById(
                "readyTime"
            ).value
        );

        document.getElementById("sets")
            .textContent=
            `セット ${currentSet} / ${
            document.getElementById(
            "totalSets").value}`;
    }

    running=true;

    timer=setInterval(()=>{
        timeLeft--;

        updateDisplay();

        if(timeLeft<=3 && timeLeft>0){
            beep(1200,100);
        }

        if(timeLeft<=0){
            nextPhase();
        }

    },1000);

}

function nextPhase(){

    clearInterval(timer);

    beep(900,400);
    vibrate(250);

    const workTime = parseInt(
    document.getElementById(
    "workTime").value);

    const restTime = parseInt(
    document.getElementById(
    "restTime").value);

    const totalSets = parseInt(
    document.getElementById(
    "totalSets").value);

    if(phase==="ready"){

        phase="work";
        document.body.className="work";
        document.getElementById("status")
            .textContent="WORK";
