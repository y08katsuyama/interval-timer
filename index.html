<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイ・インターバルタイマー</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .status {
            font-size: 1.8rem;
            color: #00e676;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .timer-display {
            font-size: 6rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            margin: 20px 0;
        }
        .sets {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            flex: 1;
        }
        .btn-start { background-color: #00e676; color: #121212; }
        .btn-stop { background-color: #ff5252; }
        .btn-reset { background-color: #424242; }
    </style>
</head>
<body>

    <div class="container">
        <div class="status" id="statusText">準備完了</div>
        <div class="timer-display" id="timeDisplay">00:30</div>
        <div class="sets" id="setInfo">セット 1 / 8</div>
        
        <div class="btn-group">
            <button class="btn-start" id="mainBtn" onclick="toggleTimer()">スタート</button>
            <button class="btn-reset" onclick="resetTimer()">リセット</button>
        </div>
    </div>

    <script>
        let workTime = 30; // 作業時間（秒）
        let restTime = 10; // 休憩時間（秒）
        let totalSets = 8; // 総セット数
        
        let currentTime = workTime;
        let currentSet = 1;
        let isWorkPhase = true;
        let timerId = null;
        let isRunning = false;

        const statusText = document.getElementById('statusText');
        const timeDisplay = document.getElementById('timeDisplay');
        const setInfo = document.getElementById('setInfo');
        const mainBtn = document.getElementById('mainBtn');

        function updateDisplay() {
            let mins = Math.floor(currentTime / 60);
            let secs = currentTime % 60;
            timeDisplay.innerText = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
            setInfo.innerText = `セット ${currentSet} / ${totalSets}`;
        }

        function beep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 800;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                // 修正：audioCtx.after のタイポを修正
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);
                osc.stop(audioCtx.currentTime + 0.2);
            } catch (e) {
                // AudioContext未対応ブラウザ対策
            }
            if (navigator.vibrate) {
                navigator.vibrate(200);
            }
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                isRunning = false;
                mainBtn.innerText = 'スタート';
                mainBtn.className = 'btn-start';
            } else {
                isRunning = true;
                mainBtn.innerText = '一時停止';
                mainBtn.className = 'btn-stop';
                
                timerId = setInterval(() => {
                    if (currentTime > 0) {
                        currentTime--;
                        if (currentTime <= 3 && currentTime > 0) {
                            beep();
                        }
                        updateDisplay();
                    } else {
                        beep();
                        // 状態の切り替え
                        if (isWorkPhase) {
                            isWorkPhase = false;
                            statusText.innerText = '休憩中';
                            statusText.style.color = '#ff5252';
                            currentTime = restTime;
                        } else {
                            if (currentSet < totalSets) {
                                currentSet++;
                                isWorkPhase = true;
                                statusText.innerText = '作業中！';
                                statusText.style.color = '#00e676';
                                currentTime = workTime;
                            } else {
                                clearInterval(timerId);
                                isRunning = false;
                                statusText.innerText = '完了！お疲れ様でした';
                                mainBtn.innerText = 'スタート';
                                mainBtn.className = 'btn-start';
                                return;
                            }
                        }
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            isWorkPhase = true;
            currentSet = 1;
            currentTime = workTime;
            statusText.innerText = '準備完了';
            statusText.style.color = '#00e676';
            mainBtn.innerText = 'スタート';
            mainBtn.className = 'btn-start';
            updateDisplay();
        }

        updateDisplay();
    </script>
</body>
</html>
